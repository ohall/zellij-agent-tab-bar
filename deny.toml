[advisories]
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "Unmaintained proc-macro helper inherited from zellij-tile 0.44.3; no patched transitive release exists" },
  { id = "RUSTSEC-2024-0375", reason = "Unmaintained terminal-detection helper inherited from zellij-tile 0.44.3; no patched transitive release exists" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[sources]
unknown-git = "deny"
unknown-registry = "deny"

[workspace]
members = ["cli", "plugin", "shared", "tests"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
readme = "README.md"

[workspace.dependencies]
clap = { version = "4.5.42", features = ["derive", "env"] }
proptest = "1.7.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.12"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.1"
zellij-tile = "0.44.3"
zellij-agent-shared = { version = "0.1.0", path = "shared" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
